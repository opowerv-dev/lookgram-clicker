<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lookgram Clicker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 40%,#4b1723,#160b12 75%);color:white;font-family:Arial,sans-serif}
.app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:25px 18px}
.brand{font-size:25px;font-weight:900;letter-spacing:2px;margin-top:12px}
.subtitle{color:#d8aeb8;font-size:13px;margin-top:7px}
.balance{width:100%;max-width:420px;text-align:center;margin-top:22px;padding:14px;background:#ffffff0d;border:1px solid #ffffff18;border-radius:17px}.balance .value{font-size:27px;color:#ffcf58}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px;margin-top:30px}
.stat{flex:1;background:#ffffff0d;border:1px solid #ffffff18;border-radius:17px;padding:15px 8px;text-align:center}
.label{font-size:12px;color:#cdaeb6}
.value{font-size:22px;font-weight:bold;margin-top:7px}
.coin-area{position:relative;display:grid;place-items:center;flex:1;width:100%;min-height:280px}
.coin{width:min(65vw,250px);aspect-ratio:1;border-radius:50%;border:5px solid #ffdc78;background:radial-gradient(circle at 35% 25%,#fff3a3,#ffbd35 45%,#d87512 80%);box-shadow:0 0 35px #ffb52d66,inset 0 0 0 8px #ffdf7655,inset 0 -12px 20px #a94c15;color:#79360c;font-size:100px;font-weight:900;display:grid;place-items:center;touch-action:manipulation;user-select:none}
.coin:active{transform:scale(.94)}
.float{position:absolute;pointer-events:none;font-weight:900;font-size:19px;color:#ffe18a;text-shadow:0 2px 10px #ff9b18;animation:fly .8s ease-out forwards;white-space:nowrap}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.8)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.2)}}
.hint{color:#cdaeb6;font-size:13px;margin-bottom:22px}
.claim{cursor:pointer;touch-action:manipulation;position:relative;z-index:5;pointer-events:auto;width:100%;max-width:380px;border:0;border-radius:16px;padding:17px;background:linear-gradient(90deg,#ffcf58,#ff9e31);color:#411c08;font-size:16px;font-weight:900}
.note{font-size:11px;color:#cdaeb6;text-align:center;margin:12px 0 8px}
.progress{height:8px;background:#5a341b;border-radius:99px;overflow:hidden;margin-top:8px}.progress #tapBar{height:100%;width:0%;background:linear-gradient(90deg,#ffcf58,#ff8c27);transition:width .1s}
</style>
</head>
<body>
<div class="app">
<div class="balance"><div class="label">МОЙ БАЛАНС</div><div class="value" id="balance">Проверь в боте</div><div id="clickCount" style="font-size:12px;opacity:.65;margin-top:4px">Кликов сделано: 0</div></div>
<div class="brand">🔴 LOOKGRAM</div>
<div class="subtitle">CLICKER • ЗАРАБАТЫВАЙ ЛУККОИНЫ</div>
<div class="stats">
<div class="stat"><div class="label">КЛИКИ</div><div class="value" id="tapProgress">0/1500</div><div class="progress"><div id="tapBar"></div></div></div>
<div class="stat"><div class="label">ОБНОВЛЕНИЕ ЛИМИТА</div><div class="value" id="timer">05:00:00</div><div class="label" id="timerStatus">Ожидание 1500 кликов</div></div>
</div>
<div class="coin-area" id="area"><button class="coin" id="coin">L</button></div>
<div class="hint">Нажимай на монету, чтобы заработать</div>

<button type="button" class="claim" id="transfer">🔄 ПЕРЕНЕСТИ НА ОСНОВНОЙ БАЛАНС</button>
</div>
<script>

const tg=window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const MAX_TAPS=1500;
const COOLDOWN=5*60*60*1000;
const TAP_KEY='lookgram_clicker_taps_v2';
const DEADLINE_KEY='lookgram_clicker_deadline_v2';
const CLAIMED_KEY='lookgram_clicker_claimed_v2';

let taps=Math.min(MAX_TAPS,Math.max(0,Number(localStorage.getItem(TAP_KEY))||0));
let deadline=Number(localStorage.getItem(DEADLINE_KEY))||0;
let claimed=localStorage.getItem(CLAIMED_KEY)==='1';

function saveState(){
  localStorage.setItem(TAP_KEY,String(taps));
  localStorage.setItem(DEADLINE_KEY,String(deadline));
  localStorage.setItem(CLAIMED_KEY,claimed?'1':'0');
}

function render(){
  const now=Date.now();

  if(deadline && now>=deadline){
    taps=0;
    deadline=0;
    claimed=false;
    saveState();
  }

  document.getElementById('tapProgress').textContent=taps+'/'+MAX_TAPS;
  document.getElementById('clickCount').textContent='Кликов сделано: '+taps;
  document.getElementById('tapBar').style.width=(taps/MAX_TAPS*100)+'%';

  const timer=document.getElementById('timer');
  const status=document.getElementById('timerStatus');

  if(taps<MAX_TAPS){
    timer.textContent='05:00:00';
    status.textContent='Ожидание 1500 кликов';
  }else{
    if(!deadline){
      deadline=now+COOLDOWN;
      saveState();
    }
    const left=Math.max(0,deadline-now);
    const h=Math.floor(left/3600000);
    const m=Math.floor((left%3600000)/60000);
    const sec=Math.floor((left%60000)/1000);
    timer.textContent=[h,m,sec].map(n=>String(n).padStart(2,'0')).join(':');
    status.textContent=claimed?'Лимит восстанавливается':'Лимит заполнен';
  }

}

const coin=document.getElementById('coin');
const area=document.getElementById('area');

coin.addEventListener('click',()=>{
  if(taps>=MAX_TAPS)return;

  taps++;
  if(taps===MAX_TAPS && !deadline) deadline=Date.now()+COOLDOWN;
  saveState();
  render();

  const el=document.createElement('span');
  el.className='float';
  el.textContent='+0.1 🪙';
  const r=coin.getBoundingClientRect(),a=area.getBoundingClientRect();
  el.style.left=(r.left+r.width/2-a.left)+'px';
  el.style.top=(r.top+r.height/2-a.top)+'px';
  el.style.setProperty('--x',(Math.random()*180-90)+'px');
  el.style.setProperty('--y',(-50-Math.random()*100)+'px');
  area.appendChild(el);
  setTimeout(()=>el.remove(),850);
});

document.getElementById('transfer').addEventListener('click',()=>{
  if(!tg || typeof tg.sendData !== 'function'){
    alert('Открой кликер через кнопку в Telegram.');
    return;
  }
  if(taps <= 0){
    alert('Сначала нажми на монету хотя бы один раз.');
    return;
  }
  if(!confirm('Перенести заработанные Луккоины на основной баланс?')) return;
  tg.sendData(JSON.stringify({action:'clicker_transfer',taps}));
});
if(deadline && Date.now()>=deadline){
  taps=0;
  deadline=0;
  claimed=false;
  saveState();
}
render();
setInterval(render,1000);

</script>
</body>
</html>
